# =====================================================================
#  STM Industry — production stack (single container + volumes)
#
#  SQLite is a file, not a server, so there is no database service here:
#  the file lives on the `storage` volume next to the Active Storage
#  uploads. That is also why DATABASE_URL points into storage/ — mounting
#  a volume over db/ would hide db/migrate and db/schema.rb.
# =====================================================================

name: stm-industry

volumes:
  storage:        # db/production.sqlite3 + Active Storage
  uploads:        # CarrierWave gallery images (public/uploads)
  logs:

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: stm-industry:latest
    container_name: stm_industry
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      RAILS_ENV: production
      # puma serves the precompiled assets itself — there is no nginx in front
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_MAX_THREADS: "5"
      DATABASE_URL: "sqlite3:storage/production.sqlite3"
    volumes:
      - storage:/rails/storage
      - uploads:/rails/public/uploads
      - logs:/rails/log
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/uk"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
