        lead:   'Индивидуальные решения для хранения грузов на палетах или на полу платформы. Перекрытие выдерживает до 1000 кг на м². Проектируем под ваши параметры.'
        about:         "<p>Индивидуальные решения для хранения грузов на паллетах или на полу платформы. Платформа собирается из стоек, ферм, усилителей и настила.
        Все элементы тщательно расчитываются нашими специалистами под индивидуальные параметры каждой платформы. На перекрытие платформы возможна установка стеллажей других типов.</p>
        <p>В качестве перекрытия могут использоваться высокопрочные древесные плиты МДФ, ДСП, OSB или металлические оцинкованные решетки. Перекрытие платформы способно выдерживать нагрузки
        до 1000 кг на 1 м.кв. Конструкция подразумевает сплошную платформу верхнего этажа с площадкой для установки паллет карой или иным подъемным механизмом.</p>"

    loft:
