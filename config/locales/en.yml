        about:         "<p>Authentic loft-style furniture. Metal and wood serve as the basis of this furniture. Loft furniture is distinguished by its lightness, reliability and outstanding design.
        Such furniture will decorate any interior and create a feeling of open space in your home. The lightness of the structure and ease of assembly mean you are not tied to a particular spot in the room.
        Loft racking is based on metal profiles painted with high-quality powder coatings in any colour. Manufacture from stainless steel is also possible.
        The decoration is made of chipboard or natural varnished (painted) wood.</p>"


