    welcome:
      about_as:           'About us'
      about_as_text:      "Our company traces its history back to 2002, starting with the sale of Italian racking. Beginning as ordinary dealers, we went through the process of setting up our own production and now provide
      a full manufacturing cycle for racking. As a family company, we guarantee our clients consistent product quality over many years. From 2002 to 2019 you knew us as PE Kremenchuk,
      and now we have rebranded and continue to produce quality, affordable racking systems under the STM Industry brand.

      <p>STM Industry is a manufacturer of archive (shelf), pallet and warehouse racking, platform trolleys, mezzanines and platforms. We provide a full
      range of services for the design, supply and installation of warehouse, industrial and household racking systems. The extensive experience of our specialists helps us manufacture racking structures
      of any complexity, and find optimal solutions for storing any goods, both with the use of handling equipment and with manual stacking. The main advantage of our company is the ability
      to manufacture any size of racking system. All structures are selected and calculated individually for each client, taking into account all fire-safety and building DSTU standards.
      STM Industry offers you the best price/quality ratio on the market for racking and racking systems.</p>

      <p>A large machine park allows us to manufacture not only racking systems but also other custom and mass-produced items. Rolling mills allow us to produce complex profiles up to 2 mm thick.
      We can produce tables, canopies, flight stairs, small architectural forms, frames of any complexity, and gates. A full cycle of work from design to installation. We manufacture products from stainless
      steel of any grade (AISI 200, AISI 304, AISI 316, AISI 430). We also offer metal machining services — turning and milling. Heat treatment of blanks. Bending of rod with
      heating. Manufacture of dies for cold stamping of metal.</p>"

      stillage:           'Archive racking'
      stillage_warehouse: 'Warehouse racking'
      stillage_pallet:    'Pallet racking'
      troles:             'Load trolleys'
      stillage_mezonin:   'Mezzanine racking'
      gallery:            'Gallery'
      platform:           'Platforms'
      loft:               'Designer racking'
      welcome_text:       'We manufacture all kinds of racking. At the best prices and the best quality. Delivery to anywhere in Ukraine.'

      delivery_eyebrow:      'Logistics'
