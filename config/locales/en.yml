    mezanine:
      index:
        header:        'Mezzanines'
        lead:   'Multi-tier systems built from warehouse or pallet racking — they add one or more floor levels to a warehouse. We engineer the structure around your building.'
        about:         "<p> Multi-tier systems assembled from warehouse or pallet racking elements. They add one or more floor levels to the warehouse. Ideal for storing manually stacked
        goods. Combined load storage is possible — pallets are placed on the warehouse floor and the first mezzanine levels, while manually stacked goods are stored on the first and higher mezzanine levels.
        The mezzanine floor decking can be made of chipboard/OSB boards or metal gratings. The maximum load per square metre of mezzanine floor can reach 1000 kg.
        If necessary, the chipboard/OSB boards can be covered with a thin metal sheet (1 mm) to reduce wear on the covering when hand pallet trucks and load trolleys move over it. Additional
        office and retail space can also be located on the mezzanine floors. All mezzanines are fitted with railings and one or more staircases. Staircases, at the client's request, can be flight stairs or a stepladder type.
        Our specialists will help you select a mezzanine to suit your goods and warehouse logistics. On-site warehouse measurement is available. We carry out mezzanine installation work.</p>"

    platform:
      index:
        header:        'Platforms'
        lead:   'Bespoke solutions for storing loads on pallets or on the platform floor. The deck carries up to 1000 kg per m². Engineered to your parameters.'
        about:         "<p> Custom solutions for storing loads on pallets or on the platform floor. The platform is assembled from uprights, trusses, reinforcers and decking.
        All elements are carefully calculated by our specialists for the individual parameters of each platform. Other types of racking can be installed on the platform decking. </p>
        <p> High-strength MDF, chipboard or OSB wood boards or galvanised metal gratings can be used as decking. The platform decking can withstand a load
        of up to 1000 kg per 1 m². The design implies a continuous upper-floor platform with an area for placing pallets by forklift or another lifting mechanism. </p>"

