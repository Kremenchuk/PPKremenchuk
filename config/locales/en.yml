    stillage:
      index:
        tip_polki:            'Shelf type'
        metall_shelf_type:    'Metal'
        dsp_shelf_type:       'Frame for chipboard (chipboard not included)'
        header:               'Archive racking'
        lead:                 'Light-duty shelving racks with up to 200 kg per shelf — for offices, archives, retail floors, garages and cellars. Configure and price yours online.'
        shelf_load_title:     'Maximum distributed load per rack shelf'
        about:                "Light-series racking with a load of up to 200 kg per shelf. Perfectly suited for offices, retail areas, archives, garages and cellars.
        Can be made with a metal shelf or a chipboard shelf. Individual rack elements can be painted with powder coating in any colour.
        The rack consists of uprights, shelves and reinforcers (the presence of a reinforcer depends on the shelf load).
                               <p>1. Upright: a bent angle with longitudinal stiffening ribs, 500-3500 mm long, made of galvanised steel grade 08KP, 1.15 mm thick.
                               Hooks for fixing the shelves are punched along the length of the upright at a pitch of 100-400 mm, allowing shelves to be set at the required height.</p>
                               <p>2. Shelf: a bent box-section structure with longitudinal stiffening ribs. Shelf length 400-1150 mm, width 250-800 mm. Stiffening rib height 30 mm.
                               The shelf is made of galvanised steel 08KP, 0.55-1.00 mm thick. Wedge-shaped holes for engaging with the upright are punched in the stiffening ribs, two on each side.
                               The second type of shelf consists of beams 40 mm high, 400-1150 mm long and 250-800 mm wide, plus a shelf cover. The shelf cover is chipboard, MDF, OSB or other available materials (at the customer's request).</p>
                               <p>3. Reinforcer: a bent profile structure made of galvanised steel 08KP, 0.55-1.00 mm thick.</p>"
      show:
        header:       'Archive rack'

