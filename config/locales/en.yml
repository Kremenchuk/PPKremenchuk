      h3_met_stel:        'Metal racking from a Ukrainian manufacturer'
      text_met_stel_anons:      'Our company has been designing and manufacturing racking equipment since 2002. The experience we have accumulated allows us to carry out projects of any complexity at the lowest prices on the market.
      We can manufacture almost any size of racking, mezzanines and platforms, taking into account all fire-safety and building DSTU standards. '
      text_met_stel_block: 'We also manufacture trolleys for transporting goods around the warehouse. For every
      project we take an individual approach with maximum attention to detail. All our products are made from high-quality materials on CNC machines. Rack parts are painted with coatings from
      European manufacturers. Our racking offers an excellent price/quality ratio. We deliver to anywhere in Ukraine, both by freight delivery services (Nova Poshta, Delivery, Intime, etc.) and by
      dedicated vehicles. Our highly qualified team of installers will assemble any racking systems on time and to the highest quality.'

      h3_we_create:       'We offer the manufacture of the following racking equipment:'

      link_text_we_create_arxiv:  'Archive racking'
      text_we_create_arxiv_anons:       ' — a light series of racking with a shelf load of up to 200 kg. The main uses for such racking are offices, archives, garages, cellars, etc. Perfectly suited for storing
      stationery, file folders and other household items.'
      text_we_create_arxiv_block: 'Shelves can be made of galvanised metal or from chipboard/OSB with reinforcing elements.
      Rack parts can be painted in various colours using high-quality powder coating. The minimum shelf installation pitch, by height, is 100 mm.'

      link_text_we_create_wareh:  'Warehouse racking'
      text_we_create_wareh_anons: ' — the most universal type of racking, with a shelf load of up to 400 kg. It can be used both in warehouses and in retail areas. Perfectly suited for storing
      assorted goods.'
      text_we_create_wareh_block: 'Can be fitted with levels for storing car tyres (wheels). Mezzanine decking can be installed on this type of racking to create a multi-level warehouse.
      The shelf can be metal (painted, galvanised) or chipboard/OSB. The minimum shelf installation pitch by height is 75 mm.'

      link_text_we_create_pallet:  'Pallet racking'
      text_we_create_pallet_anons:       ' — designed for storing palletised loads. Can be supplied with beams for EURO pallets (1200×800 mm) as well as "Finnish" pallets (1200×1000 mm).'
      text_we_create_pallet_block: 'This type of racking is the basis for heavy mezzanines and platforms. It can be fitted with shelves, as on warehouse racking. The minimum level installation pitch by height is 25 mm.'

      link_text_we_create_troley:  'Load trolleys'
      text_we_create_troley_anons: ' — convenient and multifunctional trolleys for moving loads around the warehouse. Platform, mesh, multi-tier and other types of trolleys can be produced. '
      text_we_create_troley_block: 'Significantly improves warehouse logistics. Manufactured to the customer''s individual requirements, taking into account all working conditions. Fitted with quality wheels from well-known brands.
      Load capacity up to 1000 kg. Trolleys with a load capacity of up to 1500 kg can be manufactured.'

      link_text_we_create_mez:  'Mezzanines'
      text_we_create_mez_anons: ' — multi-level racking that increases the number of storeys in a warehouse. Allows manually stacked loads to be placed without using ladders.'
      text_we_create_mez_block: 'The mezzanine floor decking can be made of chipboard/OSB, metal gratings, or chipboard/OSB covered with metal sheets to reduce wear. On mezzanine levels the use
      of trolleys is permitted (this must be specified in the design brief for the mezzanine). Mezzanines can be fitted with flight stairs. The permissible load on the mezzanine decking is up to 1000 kg
      per square metre.'

      link_text_we_create_plat:  'Platforms'
      text_we_create_plat_anons: ' — creates an additional floor level. Other types of racking can be installed on the platform floor (this must be specified in the design brief for the platform). '
      text_we_create_plat_block: 'The platform floor covering, as with a mezzanine, can be made of chipboard/OSB, metal gratings, or chipboard/OSB covered with metal sheets to reduce wear.
      The load per square metre of platform floor can reach 1500 kg. Trusses serve as the basis of the load-bearing structures of the platform floor decking. Each platform is calculated individually,
      depending on the loads, warehouse area and stored goods. A platform may include a loading area for placing goods using lifting equipment.'

      link_text_we_create_loft:  'Designer racking (Loft furniture)'
      text_we_create_loft_anons: " — authentic loft-style furniture. Metal and wood serve as the basis of this furniture. Loft furniture is distinguished by its lightness, reliability and outstanding design.
      Such furniture will decorate any interior and create a feeling of open space in your home."
      text_we_create_loft_block: "The lightness of the structure and ease of assembly mean you are not tied to a particular spot in the room.
      Loft racking is based on metal profiles painted with high-quality powder coatings in any colour. Manufacture from stainless steel is also possible.
      The decoration is made of chipboard or natural varnished (painted) wood."




